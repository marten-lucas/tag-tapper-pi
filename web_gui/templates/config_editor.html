<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag-Tapper Config Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2">
    <style>
        :root {
            --form-element-valid-border-color: var(--primary-focus);
            --form-element-invalid-border-color: var(--form-element-border-color);
        }

        body {
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.75rem;
        }

        .tab-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 0.75rem 1.25rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s;
            color: var(--muted-color);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tab-button:hover {
            color: var(--text-color);
        }

        .tab-button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .accordion {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            overflow: hidden;
            background: var(--card-background-color, #fff);
        }

        .accordion-header {
            padding: 1rem 1.25rem;
            background-color: var(--card-background-color, #fff);
            color: var(--text-color);
            cursor: pointer;
            border: none;
            width: 100%;
            text-align: left;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            transition: background-color 0.2s, color 0.2s;
            border-bottom: 1px solid var(--border-color);
        }

        .accordion-header:hover {
            background-color: var(--form-element-focus-color, #eee);
        }

        .accordion-header.active {
            background-color: var(--primary-background, rgba(0, 0, 0, 0.03));
            color: var(--text-color);
            border-left: 4px solid var(--primary-color);
        }

        /* Caret indicator */
        .accordion-header::after {
            content: '▸';
            font-size: 1rem;
            margin-left: 0.75rem;
            color: var(--muted-color);
        }

        .accordion-header.active::after {
            content: '▾';
            color: var(--primary-color);
        }

        .accordion-body {
            display: none;
            padding: 1.25rem 1.25rem 1.5rem;
            border-top: 1px solid var(--border-color);
            background: var(--card-background-color, #fff);
        }

        .accordion-body.active {
            display: block;
        }

        .section-title {
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .array-container {
            margin-top: 1rem;
        }

        .array-item {
            background-color: var(--card-background-color, #fafafa);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .array-item-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            align-items: center;
        }

        .array-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .array-item button {
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            min-width: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }

        .add-button-container {
            margin-top: 1rem;
        }

        .add-button-container button {
            width: 100%;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }

        .empty-tab {
            padding: 2rem;
            text-align: center;
            color: var(--muted-color);
        }

        .empty-tab h2 {
            margin-top: 0;
        }

        .save-status {
            padding: 0.75rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: none;
        }

        .save-status.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .save-status.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .button-group button {
            flex: 1;
        }

        .reports-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .reports-actions .actions-right {
            display: flex;
            gap: 0.5rem;
        }

        .report-meta {
            color: var(--muted-color);
            font-size: 0.95rem;
        }

        .report-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.75rem;
        }

        .report-content {
            width: 100%;
            min-height: 160px;
            resize: vertical;
        }
    </style>
</head>

<body>
    <header>
        <h1>🏷️ Tag-Tapper Pi Config</h1>
    </header>

    <div class="save-status" id="saveStatus"></div>

    <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('config')">⚙️ Config</button>
        <button class="tab-button" onclick="switchTab('live')">📊 Live</button>
        <button class="tab-button" onclick="switchTab('reports')">📋 Reports</button>
    </div>

    <!-- Config Tab -->
    <div class="tab-content active" id="config">
        <form onsubmit="saveConfig(event)">
            <div id="configContainer"></div>
            <div class="button-group">
                <button type="submit" class="primary">💾 Speichern</button>
                <button type="button" class="secondary" onclick="resetConfig()">↺ Zurücksetzen</button>
            </div>
        </form>
    </div>

    <!-- Live Tab -->
    <div class="tab-content" id="live">
        <section>
            <h2>📊 Live-Daten</h2>
            <div id="liveIp"></div>
            <div id="livePing" style="margin-top: 1rem;"></div>
        </section>
    </div>

    <!-- Reports Tab -->
    <div class="tab-content" id="reports">
        <section>
            <h2>📋 Reports</h2>
            <div class="reports-actions">
                <button type="button" class="primary" onclick="createReport()">➕ Report erzeugen</button>
                <div class="actions-right">
                    <button type="button" class="secondary outline" onclick="fetchReports()">🔄 Aktualisieren</button>
                    <button type="button" class="secondary outline" onclick="deleteAllReports()">🗑️ Alle
                        löschen</button>
                </div>
                <span id="reportsStatus" class="report-meta"></span>
            </div>
            <div id="reportsList"></div>
        </section>
    </div>

    <script>
        let globalConfig = {};
        let lastLiveIpJSON = '';
        let lastLivePingJSON = '';
        let lastReportsJSON = '';
        let reportsLoadedOnce = false;
        let reportsIntervalId = null;

        // Tab switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'reports') {
                fetchReports();
                startReportsPolling();
            } else {
                stopReportsPolling();
            }
        }

        // Load config on page load
        function loadConfig() {
            fetch('/api/config')
                .then(r => r.json())
                .then(config => {
                    globalConfig = config;
                    renderConfig(config);
                })
                .catch(e => console.error('Failed to load config:', e));
        }

        // Section order (scalars before arrays)
        function getSortKey(key, value) {
            const isArray = Array.isArray(value);
            const isObject = typeof value === 'object' && value !== null && !Array.isArray(value);

            // Order: 0 = scalars, 1 = objects, 2 = arrays
            const typeOrder = isArray ? 2 : (isObject ? 1 : 0);
            return `${typeOrder}-${key}`;
        }

        // Format section names
        function formatSectionName(key) {
            return key
                .split('_')
                .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                .join(' ');
        }

        // Get value from config by path
        function getByPath(obj, path) {
            return path.reduce((acc, key) => acc[key], obj);
        }

        // Set value in config by path
        function setByPath(obj, path, value) {
            const keys = path.slice(0, -1);
            const lastKey = path[path.length - 1];
            const target = keys.reduce((acc, key) => acc[key], obj);
            target[lastKey] = value;
        }

        // Render entire config with accordions
        function renderConfig(config) {
            const container = document.getElementById('configContainer');
            container.innerHTML = '';

            const sorted = Object.entries(config)
                .sort((a, b) => getSortKey(b[0], b[1]).localeCompare(getSortKey(a[0], a[1])))
                .forEach(([key, value]) => {
                    const accordion = createAccordion(key, value, [key]);
                    container.appendChild(accordion);
                });
        }

        // Create accordion for section
        function createAccordion(name, value, path = []) {
            const accordion = document.createElement('div');
            accordion.className = 'accordion';

            const header = document.createElement('button');
            header.type = 'button';
            header.className = 'accordion-header';
            header.textContent = formatSectionName(name);

            const body = document.createElement('div');
            body.className = 'accordion-body';

            // Visible section title inside the opened accordion
            const sectionTitle = document.createElement('h3');
            sectionTitle.className = 'section-title';
            sectionTitle.textContent = formatSectionName(name);
            body.appendChild(sectionTitle);

            if (Array.isArray(value)) {
                renderArraySection(value, path, body);
            } else if (typeof value === 'object' && value !== null) {
                renderObjectSection(value, path, body);
            } else {
                renderScalarField(name, value, path, body);
            }

            header.onclick = (e) => {
                e.preventDefault();
                header.classList.toggle('active');
                body.classList.toggle('active');
            };

            accordion.appendChild(header);
            accordion.appendChild(body);
            return accordion;
        }

        // Render scalar field
        function renderScalarField(name, value, path, container) {
            const field = document.createElement('div');
            field.className = 'form-group';

            const label = document.createElement('label');
            label.innerHTML = `<strong>${formatSectionName(name)}</strong>`;

            const input = document.createElement('input');
            input.type = typeof value === 'number' ? 'number' : 'text';
            input.value = value;
            input.dataset.path = JSON.stringify(path);

            input.addEventListener('change', () => {
                const val = input.type === 'number' ? parseFloat(input.value) : input.value;
                setByPath(globalConfig, path, val);
            });

            field.appendChild(label);
            field.appendChild(input);
            container.appendChild(field);
        }

        // Render object (non-array) section
        function renderObjectSection(obj, path, container) {
            const sorted = Object.entries(obj)
                .sort((a, b) => getSortKey(a[0], a[1]).localeCompare(getSortKey(b[0], b[1])))
                .forEach(([key, val]) => {
                    if (Array.isArray(val)) {
                        renderArraySubsection(key, val, [...path, key], container);
                    } else if (typeof val === 'object' && val !== null) {
                        renderNestedObject(key, val, [...path, key], container);
                    } else {
                        renderScalarField(key, val, [...path, key], container);
                    }
                });
        }

        // Render nested object
        function renderNestedObject(name, obj, path, container) {
            const section = document.createElement('fieldset');
            const legend = document.createElement('legend');
            legend.textContent = formatSectionName(name);
            section.appendChild(legend);

            Object.entries(obj)
                .sort((a, b) => getSortKey(a[0], a[1]).localeCompare(getSortKey(b[0], b[1])))
                .forEach(([key, val]) => {
                    if (Array.isArray(val)) {
                        renderArraySubsection(key, val, [...path, key], section);
                    } else if (typeof val === 'object' && val !== null) {
                        renderNestedObject(key, val, [...path, key], section);
                    } else {
                        renderScalarField(key, val, [...path, key], section);
                    }
                });

            container.appendChild(section);
        }

        // Render array subsection
        function renderArraySubsection(name, arr, path, container) {
            const section = document.createElement('div');
            section.className = 'form-group';

            const label = document.createElement('label');
            label.innerHTML = `<strong>${formatSectionName(name)}</strong>`;
            section.appendChild(label);

            const arrayDiv = document.createElement('div');
            arrayDiv.className = 'array-container';

            arr.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'array-item';

                const rmBtn = document.createElement('button');
                rmBtn.type = 'button';
                rmBtn.className = 'secondary outline';
                rmBtn.textContent = '🗑️ Löschen';
                rmBtn.onclick = () => {
                    arr.splice(index, 1);
                    renderConfig(globalConfig);
                };

                if (typeof item === 'object' && item !== null) {
                    const fieldsContainer = document.createElement('div');
                    fieldsContainer.className = 'array-item-fields';

                    const fields = Object.entries(item);
                    fields.forEach(([key, val]) => {
                        const field = document.createElement('div');
                        field.className = 'form-group';

                        const lbl = document.createElement('label');
                        lbl.textContent = formatSectionName(key);

                        const input = document.createElement('input');
                        input.type = typeof val === 'number' ? 'number' : 'text';
                        input.value = val;
                        input.dataset.path = JSON.stringify([...path, index, key]);

                        input.addEventListener('change', () => {
                            const v = input.type === 'number' ? parseFloat(input.value) : input.value;
                            setByPath(globalConfig, [...path, index, key], v);
                        });

                        field.appendChild(lbl);
                        field.appendChild(input);
                        fieldsContainer.appendChild(field);
                    });

                    fieldsContainer.appendChild(rmBtn);

                    itemDiv.appendChild(fieldsContainer);
                } else {
                    const scalarContainer = document.createElement('div');
                    scalarContainer.style.display = 'flex';
                    scalarContainer.style.gap = '0.75rem';
                    scalarContainer.style.alignItems = 'center';

                    const inputWrapper = document.createElement('div');
                    inputWrapper.style.flex = '1';
                    const input = document.createElement('input');
                    input.type = typeof item === 'number' ? 'number' : 'text';
                    input.value = item;
                    input.dataset.path = JSON.stringify([...path, index]);

                    input.addEventListener('change', () => {
                        const v = input.type === 'number' ? parseFloat(input.value) : input.value;
                        setByPath(globalConfig, [...path, index], v);
                    });

                    inputWrapper.appendChild(input);
                    scalarContainer.appendChild(inputWrapper);
                    scalarContainer.appendChild(rmBtn);

                    itemDiv.appendChild(scalarContainer);
                }

                arrayDiv.appendChild(itemDiv);
            });

            section.appendChild(arrayDiv);

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'outline primary add-button';
            addBtn.textContent = '➕ Neuer Eintrag';
            addBtn.onclick = () => {
                if (arr.length > 0 && typeof arr[0] === 'object' && arr[0] !== null) {
                    const template = Object.keys(arr[0]).reduce((acc, k) => {
                        acc[k] = '';
                        return acc;
                    }, {});
                    arr.push(template);
                } else {
                    arr.push('');
                }
                renderConfig(globalConfig);
            };

            const btnContainer = document.createElement('div');
            btnContainer.className = 'add-button-container';
            btnContainer.appendChild(addBtn);
            section.appendChild(btnContainer);

            container.appendChild(section);
        }

        // Render arrays at top level
        function renderArraySection(arr, path, container) {
            const arrayDiv = document.createElement('div');
            arrayDiv.className = 'array-container';

            arr.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'array-item';

                const rmBtn = document.createElement('button');
                rmBtn.type = 'button';
                rmBtn.className = 'secondary outline';
                rmBtn.textContent = '🗑️ Löschen';
                rmBtn.onclick = () => {
                    arr.splice(index, 1);
                    renderConfig(globalConfig);
                };

                if (typeof item === 'object' && item !== null) {
                    const fieldsContainer = document.createElement('div');
                    fieldsContainer.className = 'array-item-fields';

                    Object.entries(item).forEach(([key, val]) => {
                        const field = document.createElement('div');
                        field.className = 'form-group';

                        const lbl = document.createElement('label');
                        lbl.textContent = formatSectionName(key);

                        const input = document.createElement('input');
                        input.type = typeof val === 'number' ? 'number' : 'text';
                        input.value = val;
                        input.dataset.path = JSON.stringify([...path, index, key]);

                        input.addEventListener('change', () => {
                            const v = input.type === 'number' ? parseFloat(input.value) : input.value;
                            setByPath(globalConfig, [...path, index, key], v);
                        });

                        field.appendChild(lbl);
                        field.appendChild(input);
                        fieldsContainer.appendChild(field);
                    });

                    fieldsContainer.appendChild(rmBtn);

                    itemDiv.appendChild(fieldsContainer);
                } else {
                    const scalarContainer = document.createElement('div');
                    scalarContainer.style.display = 'flex';
                    scalarContainer.style.gap = '0.75rem';
                    scalarContainer.style.alignItems = 'end';

                    const inputWrapper = document.createElement('div');
                    inputWrapper.style.flex = '1';
                    const input = document.createElement('input');
                    input.type = typeof item === 'number' ? 'number' : 'text';
                    input.value = item;
                    input.dataset.path = JSON.stringify([...path, index]);

                    input.addEventListener('change', () => {
                        const v = input.type === 'number' ? parseFloat(input.value) : input.value;
                        setByPath(globalConfig, [...path, index], v);
                    });

                    inputWrapper.appendChild(input);
                    scalarContainer.appendChild(inputWrapper);
                    scalarContainer.appendChild(rmBtn);

                    itemDiv.appendChild(scalarContainer);
                }

                arrayDiv.appendChild(itemDiv);
            });

            container.appendChild(arrayDiv);

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'outline primary';
            addBtn.textContent = '➕ Neuer Eintrag';
            addBtn.onclick = () => {
                if (arr.length > 0 && typeof arr[0] === 'object' && arr[0] !== null) {
                    const template = Object.keys(arr[0]).reduce((acc, k) => {
                        acc[k] = '';
                        return acc;
                    }, {});
                    arr.push(template);
                } else {
                    arr.push('');
                }
                renderConfig(globalConfig);
            };

            const btnContainer = document.createElement('div');
            btnContainer.className = 'add-button-container';
            btnContainer.appendChild(addBtn);
            container.appendChild(btnContainer);
        }

        // Save config
        function saveConfig(e) {
            e.preventDefault();

            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(globalConfig)
            })
                .then(r => r.json())
                .then(data => {
                    const status = document.getElementById('saveStatus');
                    if (data.success) {
                        status.className = 'save-status success';
                        status.textContent = '✅ Config gespeichert';
                        setTimeout(() => status.className = 'save-status', 3000);
                    } else {
                        status.className = 'save-status error';
                        status.textContent = '❌ Fehler beim Speichern: ' + data.error;
                    }
                });
        }

        // Reset config
        function resetConfig() {
            if (confirm('Alle Änderungen zurücksetzen?')) {
                fetch('/api/config/reset', { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        loadConfig();
                        const status = document.getElementById('saveStatus');
                        status.className = 'save-status success';
                        status.textContent = '↺ Config zurückgesetzt';
                        setTimeout(() => status.className = 'save-status', 3000);
                    });
            }
        }

        // Live tab rendering
        function renderLiveIp(data) {
            const json = JSON.stringify(data || {});
            if (json === lastLiveIpJSON) {
                return; // No change; avoid rebuilding the table
            }
            lastLiveIpJSON = json;
            const div = document.getElementById('liveIp');
            const rows = data.interfaces || [];
            let html = '<h3>Schnittstellen</h3>';
            if (rows.length === 0) {
                html += '<p style="color: var(--muted-color);">Keine Schnittstellen gefunden</p>';
            } else {
                html += '<table class="striped"><thead><tr><th>Schnittstelle</th><th>IP</th><th>Status</th></tr></thead><tbody>';
                rows.forEach(r => {
                    const ip = r.ip ? r.ip : '-';
                    const status = (r.up && r.ip) ? '🟢' : '🔴';
                    html += `<tr><td>${r.display_name || r.iface}</td><td>${ip}</td><td style="text-align:center">${status}</td></tr>`;
                });
                html += '</tbody></table>';
            }
            div.innerHTML = html;
        }

        function renderLiveIpError(error) {
            lastLiveIpJSON = '';
            const div = document.getElementById('liveIp');
            div.innerHTML = '<h3>Schnittstellen</h3><p style="color: var(--del-color);">⚠️ Fehler beim Laden der Schnittstellen</p>';
        }

        function renderLiveIpLoading() {
            const div = document.getElementById('liveIp');
            div.innerHTML = '<h3>Schnittstellen</h3><p style="color: var(--muted-color);">Lädt...</p>';
        }

        function renderLivePing(data) {
            const json = JSON.stringify(data || {});
            if (json === lastLivePingJSON) {
                return; // No change; avoid rebuilding the table
            }
            lastLivePingJSON = json;
            const div = document.getElementById('livePing');
            const ifaces = data.interfaces || [];
            const targets = data.targets || [];
            const results = data.results || {};
            let html = '<h3>Ping</h3>';
            if (!targets.length) {
                html += '<p style="color: var(--muted-color);">Keine Ping-Ziele konfiguriert</p>';
                div.innerHTML = html;
                return;
            }
            html += '<table class="striped"><thead><tr><th>Ziel</th>';
            ifaces.forEach(iface => {
                const label = iface === 'eth0' ? 'eth0' : (iface.startsWith('eth0.') ? iface.replace('eth0.', '') : iface);
                html += `<th>${label}</th>`;
            });
            html += '</tr></thead><tbody>';
            targets.forEach(t => {
                html += `<tr><td>${t.name}</td>`;
                ifaces.forEach(iface => {
                    const reachable = (results[iface] || {})[t.host] ? '🟢' : '🔴';
                    html += `<td style="text-align:center">${reachable}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            div.innerHTML = html;
        }

        function renderLivePingError(error) {
            lastLivePingJSON = '';
            const div = document.getElementById('livePing');
            div.innerHTML = '<h3>Ping</h3><p style="color: var(--del-color);">⚠️ Fehler beim Laden der Ping-Daten</p>';
        }

        function renderLivePingLoading() {
            const div = document.getElementById('livePing');
            div.innerHTML = '<h3>Ping</h3><p style="color: var(--muted-color);">Lädt...</p>';
        }

        // Reports tab helpers
        function formatTimestamp(ts) {
            if (typeof ts !== 'number') return '-';
            try {
                return new Date(ts * 1000).toLocaleString('de-DE');
            } catch (e) {
                return '-';
            }
        }

        function renderReportsLoading() {
            const list = document.getElementById('reportsList');
            list.innerHTML = '<p style="color: var(--muted-color);">Lädt...</p>';
            const status = document.getElementById('reportsStatus');
            status.textContent = '';
        }

        function renderReportsError() {
            const list = document.getElementById('reportsList');
            list.innerHTML = '<p style="color: var(--del-color);">⚠️ Fehler beim Laden der Reports</p>';
            const status = document.getElementById('reportsStatus');
            status.textContent = '';
        }

        function renderReports(data) {
            const json = JSON.stringify(data || {});
            if (json === lastReportsJSON && reportsLoadedOnce) {
                return;
            }
            lastReportsJSON = json;
            reportsLoadedOnce = true;

            const list = document.getElementById('reportsList');
            const status = document.getElementById('reportsStatus');
            const reports = (data && data.reports) ? data.reports : [];

            if (!reports.length) {
                list.innerHTML = '<p style="color: var(--muted-color);">Keine Reports vorhanden</p>';
                status.textContent = '';
                return;
            }

            list.innerHTML = '';
            status.textContent = `${reports.length} Report${reports.length === 1 ? '' : 's'}`;

            reports.forEach(rep => {
                const acc = document.createElement('div');
                acc.className = 'accordion';

                const header = document.createElement('button');
                header.type = 'button';
                header.className = 'accordion-header';

                const titleSpan = document.createElement('span');
                titleSpan.textContent = rep.name;

                const dateSpan = document.createElement('span');
                dateSpan.className = 'report-meta';
                dateSpan.textContent = formatTimestamp(rep.created_ts);

                header.appendChild(titleSpan);
                header.appendChild(dateSpan);

                const body = document.createElement('div');
                body.className = 'accordion-body';

                const textarea = document.createElement('textarea');
                textarea.className = 'report-content';
                textarea.readOnly = true;
                textarea.value = rep.content || '';
                const lineCount = textarea.value.split('\n').length + 2;
                textarea.rows = Math.min(18, Math.max(8, lineCount));

                const btnRow = document.createElement('div');
                btnRow.className = 'report-buttons';

                const copyBtn = document.createElement('button');
                copyBtn.type = 'button';
                copyBtn.className = 'secondary outline';
                copyBtn.textContent = '📋 Kopieren';
                copyBtn.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(rep.content || '');
                        copyBtn.textContent = '✅ Kopiert';
                        setTimeout(() => copyBtn.textContent = '📋 Kopieren', 1200);
                    } catch (err) {
                        copyBtn.textContent = '⚠️ Fehler';
                        setTimeout(() => copyBtn.textContent = '📋 Kopieren', 1200);
                    }
                };

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'secondary outline';
                delBtn.textContent = '🗑️ Löschen';
                delBtn.onclick = () => deleteReport(rep.name);

                btnRow.appendChild(copyBtn);
                btnRow.appendChild(delBtn);

                body.appendChild(textarea);
                body.appendChild(btnRow);

                header.onclick = (e) => {
                    e.preventDefault();
                    header.classList.toggle('active');
                    body.classList.toggle('active');
                };

                acc.appendChild(header);
                acc.appendChild(body);
                list.appendChild(acc);
            });
        }

        function fetchReports() {
            if (!reportsLoadedOnce) {
                renderReportsLoading();
            }
            fetch('/api/reports', { signal: AbortSignal.timeout(8000) })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(renderReports)
                .catch(err => {
                    console.error('Reports fetch failed:', err);
                    lastReportsJSON = '';
                    renderReportsError();
                });
        }

        function startReportsPolling() {
            if (reportsIntervalId !== null) return;
            reportsIntervalId = setInterval(fetchReports, 10000);
        }

        function stopReportsPolling() {
            if (reportsIntervalId !== null) {
                clearInterval(reportsIntervalId);
                reportsIntervalId = null;
            }
        }

        function deleteReport(name) {
            if (!confirm(`Report "${name}" löschen?`)) return;
            fetch(`/api/reports/${encodeURIComponent(name)}`, { method: 'DELETE' })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                })
                .then(fetchReports)
                .catch(err => {
                    console.error('Delete report failed:', err);
                    alert('Konnte Report nicht löschen');
                });
        }

        function deleteAllReports() {
            if (!confirm('Alle Reports löschen?')) return;
            fetch('/api/reports', { method: 'DELETE' })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                })
                .then(() => {
                    lastReportsJSON = '';
                    fetchReports();
                })
                .catch(err => {
                    console.error('Delete all reports failed:', err);
                    alert('Konnte Reports nicht löschen');
                });
        }

        function createReport() {
            const status = document.getElementById('reportsStatus');
            status.textContent = 'Erzeuge Report...';
            fetch('/api/reports/create', { method: 'POST' })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                })
                .then(() => {
                    lastReportsJSON = '';
                    fetchReports();
                })
                .catch(err => {
                    console.error('Report creation failed:', err);
                    status.textContent = 'Fehler beim Erzeugen';
                    setTimeout(() => status.textContent = '', 2000);
                    alert('Konnte Report nicht erzeugen');
                });
        }

        function fetchLiveIp() {
            if (!lastLiveIpJSON) {
                renderLiveIpLoading();
            }
            fetch('/api/live/ip', { signal: AbortSignal.timeout(8000) })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(renderLiveIp)
                .catch(err => {
                    console.error('Live IP fetch failed:', err);
                    renderLiveIpError(err);
                });
        }

        function fetchLivePing() {
            if (!lastLivePingJSON) {
                renderLivePingLoading();
            }
            fetch('/api/live/ping', { signal: AbortSignal.timeout(15000) })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(renderLivePing)
                .catch(err => {
                    console.error('Live Ping fetch failed:', err);
                    renderLivePingError(err);
                });
        }

        // Load config on page load
        loadConfig();

        // Start live data refresh
        fetchLiveIp();
        fetchLivePing();
        setInterval(fetchLiveIp, 5000);
        setInterval(fetchLivePing, 10000);

        // Load reports when the tab is visited (and once on startup for freshness)
        fetchReports();
    </script>
</body>

</html>
