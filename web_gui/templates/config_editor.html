<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag-Tapper Config Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2">
    <style>
        :root {
            --form-element-valid-border-color: var(--primary-focus);
            --form-element-invalid-border-color: var(--form-element-border-color);
        }

        body {
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.75rem;
        }

        .tab-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 0.75rem 1.25rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s;
            color: var(--muted-color);
        }

        .tab-button:hover {
            color: var(--text-color);
        }

        .tab-button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .accordion {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .accordion-header {
            padding: 1rem;
            background-color: var(--gray-bg, #f6f6f6);
            cursor: pointer;
            border: none;
            width: 100%;
            text-align: left;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .accordion-header:hover {
            background-color: var(--form-element-focus-color, #eee);
        }

        .accordion-header.active {
            background-color: var(--primary-color);
            color: white;
        }

        .accordion-body {
            display: none;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .accordion-body.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .array-container {
            margin-top: 1rem;
        }

        .array-item {
            background-color: var(--card-background-color, #fafafa);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: grid;
            gap: 0.75rem;
        }

        .array-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .array-item button {
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            min-width: auto;
        }

        .add-button-container {
            margin-top: 1rem;
        }

        .add-button-container button {
            width: 100%;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }

        .empty-tab {
            padding: 2rem;
            text-align: center;
            color: var(--muted-color);
        }

        .empty-tab h2 {
            margin-top: 0;
        }

        .save-status {
            padding: 0.75rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: none;
        }

        .save-status.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .save-status.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .button-group button {
            flex: 1;
        }
    </style>
</head>

<body>
    <header>
        <h1>🏷️ Tag-Tapper Pi Config</h1>
    </header>

    <div class="save-status" id="saveStatus"></div>

    <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('config')">⚙️ Config</button>
        <button class="tab-button" onclick="switchTab('live')">📊 Live</button>
        <button class="tab-button" onclick="switchTab('reports')">📋 Reports</button>
    </div>

    <!-- Config Tab -->
    <div class="tab-content active" id="config">
        <form onsubmit="saveConfig(event)">
            <div id="configContainer"></div>
            <div class="button-group">
                <button type="submit" class="primary">💾 Speichern</button>
                <button type="button" class="secondary" onclick="resetConfig()">↺ Zurücksetzen</button>
            </div>
        </form>
    </div>

    <!-- Live Tab -->
    <div class="tab-content" id="live">
        <div class="empty-tab">
            <h2>📊 Live-Daten</h2>
            <p>Hier werden bald Live-Daten vom Panel angezeigt.</p>
        </div>
    </div>

    <!-- Reports Tab -->
    <div class="tab-content" id="reports">
        <div class="empty-tab">
            <h2>📋 Reports</h2>
            <p>Hier werden bald verfügbare Reports angezeigt.</p>
        </div>
    </div>

    <script>
        let globalConfig = {};

        // Tab switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Load config on page load
        function loadConfig() {
            fetch('/api/config')
                .then(r => r.json())
                .then(config => {
                    globalConfig = config;
                    renderConfig(config);
                })
                .catch(e => console.error('Failed to load config:', e));
        }

        // Section order (scalars before arrays)
        function getSortKey(key, value) {
            const isArray = Array.isArray(value);
            const isObject = typeof value === 'object' && value !== null && !Array.isArray(value);

            // Order: 0 = scalars, 1 = objects, 2 = arrays
            const typeOrder = isArray ? 2 : (isObject ? 1 : 0);
            return `${typeOrder}-${key}`;
        }

        // Format section names
        function formatSectionName(key) {
            return key
                .split('_')
                .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                .join(' ');
        }

        // Get value from config by path
        function getByPath(obj, path) {
            return path.reduce((acc, key) => acc[key], obj);
        }

        // Set value in config by path
        function setByPath(obj, path, value) {
            const keys = path.slice(0, -1);
            const lastKey = path[path.length - 1];
            const target = keys.reduce((acc, key) => acc[key], obj);
            target[lastKey] = value;
        }

        // Render entire config with accordions
        function renderConfig(config) {
            const container = document.getElementById('configContainer');
            container.innerHTML = '';

            const sorted = Object.entries(config)
                .sort((a, b) => getSortKey(a[0], a[1]).localeCompare(getSortKey(b[0], b[1])))
                .forEach(([key, value]) => {
                    const accordion = createAccordion(key, value, [key]);
                    container.appendChild(accordion);
                });
        }

        // Create accordion for section
        function createAccordion(name, value, path = []) {
            const accordion = document.createElement('div');
            accordion.className = 'accordion';

            const header = document.createElement('button');
            header.type = 'button';
            header.className = 'accordion-header active';
            header.textContent = formatSectionName(name);

            const body = document.createElement('div');
            body.className = 'accordion-body active';

            if (Array.isArray(value)) {
                renderArraySection(value, path, body);
            } else if (typeof value === 'object' && value !== null) {
                renderObjectSection(value, path, body);
            } else {
                renderScalarField(name, value, path, body);
            }

            header.onclick = (e) => {
                e.preventDefault();
                header.classList.toggle('active');
                body.classList.toggle('active');
            };

            accordion.appendChild(header);
            accordion.appendChild(body);
            return accordion;
        }

        // Render scalar field
        function renderScalarField(name, value, path, container) {
            const field = document.createElement('div');
            field.className = 'form-group';

            const label = document.createElement('label');
            label.innerHTML = `<strong>${formatSectionName(name)}</strong>`;

            const input = document.createElement('input');
            input.type = typeof value === 'number' ? 'number' : 'text';
            input.value = value;
            input.dataset.path = JSON.stringify(path);

            input.addEventListener('change', () => {
                const val = input.type === 'number' ? parseFloat(input.value) : input.value;
                setByPath(globalConfig, path, val);
            });

            field.appendChild(label);
            field.appendChild(input);
            container.appendChild(field);
        }

        // Render object (non-array) section
        function renderObjectSection(obj, path, container) {
            const sorted = Object.entries(obj)
                .sort((a, b) => getSortKey(a[0], a[1]).localeCompare(getSortKey(b[0], b[1])))
                .forEach(([key, val]) => {
                    if (Array.isArray(val)) {
                        renderArraySubsection(key, val, [...path, key], container);
                    } else if (typeof val === 'object' && val !== null) {
                        renderNestedObject(key, val, [...path, key], container);
                    } else {
                        renderScalarField(key, val, [...path, key], container);
                    }
                });
        }

        // Render nested object
        function renderNestedObject(name, obj, path, container) {
            const section = document.createElement('fieldset');
            const legend = document.createElement('legend');
            legend.textContent = formatSectionName(name);
            section.appendChild(legend);

            Object.entries(obj)
                .sort((a, b) => getSortKey(a[0], a[1]).localeCompare(getSortKey(b[0], b[1])))
                .forEach(([key, val]) => {
                    if (Array.isArray(val)) {
                        renderArraySubsection(key, val, [...path, key], section);
                    } else if (typeof val === 'object' && val !== null) {
                        renderNestedObject(key, val, [...path, key], section);
                    } else {
                        renderScalarField(key, val, [...path, key], section);
                    }
                });

            container.appendChild(section);
        }

        // Render array subsection
        function renderArraySubsection(name, arr, path, container) {
            const section = document.createElement('div');
            section.className = 'form-group';

            const label = document.createElement('label');
            label.innerHTML = `<strong>${formatSectionName(name)}</strong>`;
            section.appendChild(label);

            const arrayDiv = document.createElement('div');
            arrayDiv.className = 'array-container';

            arr.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'array-item';

                if (typeof item === 'object' && item !== null) {
                    const fields = Object.entries(item);
                    fields.forEach(([key, val]) => {
                        const field = document.createElement('div');
                        field.className = 'form-group';

                        const lbl = document.createElement('label');
                        lbl.textContent = formatSectionName(key);

                        const input = document.createElement('input');
                        input.type = typeof val === 'number' ? 'number' : 'text';
                        input.value = val;
                        input.dataset.path = JSON.stringify([...path, index, key]);

                        input.addEventListener('change', () => {
                            const v = input.type === 'number' ? parseFloat(input.value) : input.value;
                            setByPath(globalConfig, [...path, index, key], v);
                        });

                        field.appendChild(lbl);
                        field.appendChild(input);
                        itemDiv.appendChild(field);
                    });
                } else {
                    const input = document.createElement('input');
                    input.type = typeof item === 'number' ? 'number' : 'text';
                    input.value = item;
                    input.dataset.path = JSON.stringify([...path, index]);

                    input.addEventListener('change', () => {
                        const v = input.type === 'number' ? parseFloat(input.value) : input.value;
                        setByPath(globalConfig, [...path, index], v);
                    });

                    itemDiv.appendChild(input);
                }

                const rmBtn = document.createElement('button');
                rmBtn.type = 'button';
                rmBtn.className = 'secondary outline';
                rmBtn.textContent = '🗑️ Löschen';
                rmBtn.onclick = () => {
                    arr.splice(index, 1);
                    renderConfig(globalConfig);
                };

                itemDiv.appendChild(rmBtn);
                arrayDiv.appendChild(itemDiv);
            });

            section.appendChild(arrayDiv);

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'outline primary add-button';
            addBtn.textContent = '➕ Neuer Eintrag';
            addBtn.onclick = () => {
                if (arr.length > 0 && typeof arr[0] === 'object' && arr[0] !== null) {
                    const template = Object.keys(arr[0]).reduce((acc, k) => {
                        acc[k] = '';
                        return acc;
                    }, {});
                    arr.push(template);
                } else {
                    arr.push('');
                }
                renderConfig(globalConfig);
            };

            const btnContainer = document.createElement('div');
            btnContainer.className = 'add-button-container';
            btnContainer.appendChild(addBtn);
            section.appendChild(btnContainer);

            container.appendChild(section);
        }

        // Render arrays at top level
        function renderArraySection(arr, path, container) {
            const arrayDiv = document.createElement('div');
            arrayDiv.className = 'array-container';

            arr.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'array-item';

                if (typeof item === 'object' && item !== null) {
                    Object.entries(item).forEach(([key, val]) => {
                        const field = document.createElement('div');
                        field.className = 'form-group';

                        const lbl = document.createElement('label');
                        lbl.textContent = formatSectionName(key);

                        const input = document.createElement('input');
                        input.type = typeof val === 'number' ? 'number' : 'text';
                        input.value = val;
                        input.dataset.path = JSON.stringify([...path, index, key]);

                        input.addEventListener('change', () => {
                            const v = input.type === 'number' ? parseFloat(input.value) : input.value;
                            setByPath(globalConfig, [...path, index, key], v);
                        });

                        field.appendChild(lbl);
                        field.appendChild(input);
                        itemDiv.appendChild(field);
                    });
                } else {
                    const input = document.createElement('input');
                    input.type = typeof item === 'number' ? 'number' : 'text';
                    input.value = item;
                    input.dataset.path = JSON.stringify([...path, index]);

                    input.addEventListener('change', () => {
                        const v = input.type === 'number' ? parseFloat(input.value) : input.value;
                        setByPath(globalConfig, [...path, index], v);
                    });

                    itemDiv.appendChild(input);
                }

                const rmBtn = document.createElement('button');
                rmBtn.type = 'button';
                rmBtn.className = 'secondary outline';
                rmBtn.textContent = '🗑️ Löschen';
                rmBtn.onclick = () => {
                    arr.splice(index, 1);
                    renderConfig(globalConfig);
                };

                itemDiv.appendChild(rmBtn);
                arrayDiv.appendChild(itemDiv);
            });

            container.appendChild(arrayDiv);

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'outline primary';
            addBtn.textContent = '➕ Neuer Eintrag';
            addBtn.onclick = () => {
                if (arr.length > 0 && typeof arr[0] === 'object' && arr[0] !== null) {
                    const template = Object.keys(arr[0]).reduce((acc, k) => {
                        acc[k] = '';
                        return acc;
                    }, {});
                    arr.push(template);
                } else {
                    arr.push('');
                }
                renderConfig(globalConfig);
            };

            const btnContainer = document.createElement('div');
            btnContainer.className = 'add-button-container';
            btnContainer.appendChild(addBtn);
            container.appendChild(btnContainer);
        }

        // Save config
        function saveConfig(e) {
            e.preventDefault();

            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(globalConfig)
            })
                .then(r => r.json())
                .then(data => {
                    const status = document.getElementById('saveStatus');
                    if (data.success) {
                        status.className = 'save-status success';
                        status.textContent = '✅ Config gespeichert';
                        setTimeout(() => status.className = 'save-status', 3000);
                    } else {
                        status.className = 'save-status error';
                        status.textContent = '❌ Fehler beim Speichern: ' + data.error;
                    }
                });
        }

        // Reset config
        function resetConfig() {
            if (confirm('Alle Änderungen zurücksetzen?')) {
                fetch('/api/config/reset', { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        loadConfig();
                        const status = document.getElementById('saveStatus');
                        status.className = 'save-status success';
                        status.textContent = '↺ Config zurückgesetzt';
                        setTimeout(() => status.className = 'save-status', 3000);
                    });
            }
        }

        // Load config on page load
        loadConfig();
    </script>
</body>

</html>
